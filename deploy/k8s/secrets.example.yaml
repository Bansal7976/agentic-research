# Copy to secrets.yaml (gitignored), fill values, then: kubectl apply -f secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: agentic-research
type: Opaque
stringData:
  GOOGLE_API_KEY: "paste-gemini-key"
  SERVICE_API_KEY: "choose-a-strong-key"
  LANGSMITH_TRACING: "true"
  LANGSMITH_API_KEY: "paste-langsmith-key"
  LANGSMITH_PROJECT: "agentic-research"
  TAVILY_API_KEY: ""
  GCP_PROJECT_ID: "your-project-id"
  GCS_BUCKET: "your-bucket-name"
  BQ_DATASET: "agent_analytics"
  BQ_TABLE: "requests"

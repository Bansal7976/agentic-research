# All three backend microservices. Replace REGION/PROJECT_ID in image paths
# after pushing images to Artifact Registry (see docs/11).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-tools
  namespace: agentic-research
spec:
  replicas: 1
  selector: { matchLabels: { app: mcp-tools } }
  template:
    metadata: { labels: { app: mcp-tools } }
    spec:
      containers:
        - name: mcp-tools
          image: REGION-docker.pkg.dev/PROJECT_ID/agentic/mcp-tools:latest
          ports: [{ containerPort: 8100 }]
          envFrom: [{ secretRef: { name: app-secrets } }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-tools
  namespace: agentic-research
spec:
  selector: { app: mcp-tools }
  ports: [{ port: 8100, targetPort: 8100 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: agentic-research
spec:
  replicas: 1
  selector: { matchLabels: { app: rag-service } }
  template:
    metadata: { labels: { app: rag-service } }
    spec:
      containers:
        - name: rag-service
          image: REGION-docker.pkg.dev/PROJECT_ID/agentic/rag-service:latest
          ports: [{ containerPort: 8001 }]
          envFrom: [{ secretRef: { name: app-secrets } }]
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: rag-service
  namespace: agentic-research
spec:
  selector: { app: rag-service }
  ports: [{ port: 8001, targetPort: 8001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: agentic-research
spec:
  replicas: 2                      # two replicas -> Service load-balances between pods
  selector: { matchLabels: { app: agent-service } }
  template:
    metadata: { labels: { app: agent-service } }
    spec:
      containers:
        - name: agent-service
          image: REGION-docker.pkg.dev/PROJECT_ID/agentic/agent-service:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: app-secrets } }]
          env:
            - { name: MCP_SERVER_URL, value: "http://mcp-tools:8100/mcp" }
            - { name: RAG_SERVICE_URL, value: "http://rag-service:8001" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: agent-service
  namespace: agentic-research
spec:
  selector: { app: agent-service }
  ports: [{ port: 8000, targetPort: 8000 }]

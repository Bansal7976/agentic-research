# Run the whole system locally:  docker compose -f deploy/docker-compose.yml up --build
# Then open http://localhost  (frontend via nginx)
services:
  mcp-tools:
    build: ../services/mcp-tools-server
    env_file: ../.env
    volumes:
      - ../reports:/app/reports   # local report fallback visible on host

  rag-service:
    build: ../services/rag-service
    env_file: ../.env
    volumes:
      - rag-data:/app/chroma_db   # vector store survives restarts

  agent-service:
    build: ../services/agent-service
    env_file: ../.env
    environment:                  # inside compose, services reach each other by name
      MCP_SERVER_URL: http://mcp-tools:8100/mcp
      RAG_SERVICE_URL: http://rag-service:8001
    depends_on: [mcp-tools, rag-service]

  gateway:
    image: nginx:1.27-alpine
    ports: ["80:80"]              # the ONLY public entry point
    volumes:
      - ../gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../gateway/nginx/html:/usr/share/nginx/html:ro
    depends_on: [agent-service, rag-service]

volumes:
  rag-data:

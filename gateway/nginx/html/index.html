<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Research Assistant</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 780px; margin: 40px auto; padding: 0 16px; background:#0f1220; color:#e8e8f0; }
  h1 { font-size: 1.5rem; } .muted { color:#9aa0b4; font-size:.9rem; }
  input, button { font-size: 1rem; padding: 10px; border-radius: 8px; border: 1px solid #333a55; }
  input { width: 100%; box-sizing: border-box; background:#181c30; color:#e8e8f0; margin: 6px 0; }
  button { background:#4f6ef7; color:white; border:none; cursor:pointer; margin-top:8px; }
  button:disabled { opacity:.5; }
  pre { background:#181c30; padding:16px; border-radius:8px; white-space:pre-wrap; word-wrap:break-word; }
</style>
</head>
<body>
  <h1>🧠 Agentic Research Assistant</h1>
  <p class="muted">Planner → Researcher (MCP tools) → Summarizer → Writer, with guardrails. Served via nginx.</p>
  <input id="key" type="password" placeholder="X-API-Key (SERVICE_API_KEY from .env)">
  <input id="topic" placeholder="Research topic, e.g. Impact of AI on the Indian job market">
  <button id="go" onclick="run()">Research</button>
  <p id="status" class="muted"></p>
  <pre id="out" hidden></pre>
<script>
async function run() {
  const btn = document.getElementById('go'), status = document.getElementById('status'), out = document.getElementById('out');
  btn.disabled = true; out.hidden = true; status.textContent = 'Agents working… this can take 1–3 minutes.';
  try {
    const res = await fetch('/api/agent/research', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': document.getElementById('key').value },
      body: JSON.stringify({ topic: document.getElementById('topic').value })
    });
    const data = await res.json();
    out.textContent = res.ok ? data.report + '\n\n---\nSaved to: ' + (data.report_location || 'n/a') : 'Error ' + res.status + ': ' + JSON.stringify(data);
    out.hidden = false; status.textContent = res.ok ? 'Done. Request ID: ' + data.request_id : '';
  } catch (e) { status.textContent = 'Request failed: ' + e; }
  btn.disabled = false;
}
</script>
</body>
</html>

worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;

    # Layer-1 rate limiting at the edge (agent-service has its own layer too)
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    # Round-robin load balancing: add more servers here (or replicas in k8s)
    upstream agent_backend { server agent-service:8000; }
    upstream rag_backend   { server rag-service:8001; }

    server {
        listen 80;

        # Static frontend
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # Reverse proxy: /api/agent/research -> agent-service:8000/research
        location /api/agent/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://agent_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;   # agent research can take minutes
        }

        location /api/rag/ {
            client_max_body_size 20m;  # allow document uploads
            proxy_pass http://rag_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}

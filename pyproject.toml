[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = errors, I = import order, UP = modern syntax, B = common bugs.
# Deliberately NOT enabling BLE: our broad `except Exception` blocks are
# intentional (best-effort analytics, tool error wrapping, lazy graph build).
select = ["E", "F", "I", "UP", "B"]
